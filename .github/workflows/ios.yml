name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Ensure Gradle wrapper
        run: gradle wrapper --gradle-version 8.11.1

      - name: Compile the shared Kotlin framework for the simulator
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Common unit tests
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build the iOS app (simulator, unsigned)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
